<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumiskin - Login</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

<header>
    <div class="container"> 
        <nav>
            <ul class="navbuttons">
                <li><a href="index.html"><b>Home</b></a></li>
                <li><a href="products.html"><b>Products</b></a></li>
                <li><a href="about.html"><b>About</b></a></li>
            </ul>
        </nav>
        <a href="index.html" class="logo"><div class="logotext"><i>Lumiskin</i></div></a>  

        <div class="nav-buttons">
            <a href="login.html" class="btn-secondary"><b>Account</b></a>
            <a href="cart.html" class="btn-primary"><b>Cart</b></a>
        </div>  
    </div>
</header>
  
<div class="split-layout">
    <div class="panel-image">
        <img src="../images/skin2.jpg" alt="Skincare">
        <p class="tagline">Time to invest in your <strong>SKIN</strong></p>
    </div>

    <div class="panel-form">
        <div class="login-box">
            <h2 class="login-title">Login</h2>

            <div class="login-body">
                <form class="login-form" onsubmit="event.preventDefault(); validateLogin();">
                    <label for="Login_Email">Email</label>
                    <input type="email" id="Login_Email" placeholder="Enter your email" autocomplete="username" required>

                    <label for="Login_Password">Password</label>
                    <input type="password" id="Login_Password" placeholder="Enter your password" autocomplete="current-password" required>

                    <button type="submit" class="btn-primary" id="log">Login</button>

                    <p id="error-msg" style="color:#a36c45; font-size:14px; margin-top:10px; display:none;"></p>

                    <div class="form-links">
                        <a href="forgot-password.html">Forgot your password?</a>
                        <p>Don't have an account? <a href="signup.html">Sign up</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Fixed: was login.js (non-existent), now correctly points to auth.js -->
<script src="../js/auth.js"></script>
</body>
</html>
