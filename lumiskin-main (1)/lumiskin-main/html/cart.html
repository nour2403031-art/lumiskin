<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LumiSkin – Cart</title>
    <link rel="stylesheet" href="../css/cart.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

<header>
    <div class="container">
        <nav>
            <ul class="navbuttons">
                <li><a href="index.html"><b>Home</b></a></li>
                <li><a href="index.html#brand-section"><b>Products</b></a></li>
                <li><a href="#"><b>About</b></a></li>
            </ul>
        </nav>
        <a href="index.html" class="logo"><div class="logotext"><i>Lumiskin</i></div></a>
        <div class="nav-buttons">
            <a href="login.html" class="btn-secondary"><b>Account</b></a>
            <a href="cart.html" class="btn-secondary"><b>Cart</b></a>
        </div>
    </div>
</header>

<main class="cart-main">
    <h1 class="cart-heading">Your Cart</h1>

    <div class="cart-layout">
        <div class="cart-items-panel">
            <div id="emptyMsg" class="empty-msg" style="display:none;">
                <p>Your cart is empty.</p>
                <a href="index.html#brand-section" class="btn-shop">Continue Shopping</a>
            </div>
            <ul id="cartItems" class="cart-list"></ul>
        </div>

        <div class="cart-summary" id="cartSummary" style="display:none;">
            <h2>Order Summary</h2>
            <div class="summary-row"><span>Subtotal</span><span id="subtotal">0 EGP</span></div>
            <div class="summary-row"><span>Shipping</span><span>Free</span></div>
            <div class="summary-row total-row"><span>Total</span><span id="totalAmount">0 EGP</span></div>
            <button class="btn-checkout" onclick="checkout()">Proceed to Checkout</button>
            <a href="index.html#brand-section" class="btn-continue-shop">← Continue Shopping</a>
        </div>
    </div>
</main>

<script src="../js/cart.js"></script>
</body>
</html>
